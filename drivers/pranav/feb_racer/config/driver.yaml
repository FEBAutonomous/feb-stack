# feb_racer: the memory racer for walls. Warm-up lap on the gap-follower law, then a raceline
# tracked by pure pursuit. Every value has a comment in racer.py.
racer:
  ros__parameters:
    warmup_speed: 1.5     # m/s on the mapping lap: slow means a dense map, 15 cm between scans at 10 Hz
    recover_speed: 1.3    # m/s on the gap-follower law while the map does not match
    v_max: 3.0            # m/s cap of the raceline's speed profile
    ay_max: 4.0           # m/s^2 lateral limit the profile assumes
    a_acc: 3.0            # m/s^2
    a_dec: 5.0            # m/s^2
    speed_scale: 1.0      # scales the whole profile: 0.8 for a first run on a new track
    wall_margin_m: 0.25   # the raceline keeps half a car plus this from the walls
    lost_score: 0.45      # match score below which the pose is not trusted
    lost_handoff_s: 0.3   # s of bad matches before the gap follower takes over
    lookahead_min: 0.9    # m, pure pursuit lookahead at rest
    lookahead_gain: 0.55  # s, lookahead grows with speed
    lookahead_max: 2.4    # m
    speed_horizon_m: 1.5  # m of profile ahead the speed command looks at
    min_lap_m: 20.0       # m driven before the lap may count as closed
    mapping: true
    close_radius_m: 1.5   # m from the start that closes the lap
