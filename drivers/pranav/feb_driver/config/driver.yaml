# Tune these. Every value has a comment in reactive_driver.py.
reactive_driver:
  ros__parameters:
    bubble: 0.50          # m, safety radius zeroed around the nearest return
    gap_fov: 1.60         # rad, half field of view considered for gaps
    range_cap: 6.0        # m, ranges are clipped here before choosing a gap
    steer_gain: 0.7       # steering = gain * bearing of the gap target (after delay compensation)
    deep_weight: 0.6      # target = deep_weight * deepest beam + (1 - deep_weight) * gap middle
    max_speed: 2.0        # m/s on an open straight
    min_speed: 0.9        # m/s floor in tight corners
    accel_limit: 4.0      # m/s^2, how fast the speed target may rise
    decel_limit: 6.0      # m/s^2, how fast it may fall, and the braking assumed for clearance
    lat_accel: 4.5        # m/s^2 cornering limit used for the speed target
    brake_margin: 0.55    # m, stopping distance margin before the clearance ahead
    clear_pct: 3.0        # percentile of the corridor ranges taken as the clearance
    clear_tau: 0.30       # s, clearance low-pass
    curv_tau: 0.35        # s, steering low-pass used for the cornering speed
    goal_tau: 0.30        # s, speed goal low-pass
    steer_tau: 0.20       # s, steering low-pass (on top of the actuator rate limit)
    follow_gap: 0.0       # m; > 0 makes the driver sit behind a car ahead instead of passing it (the house racer uses 2.0)
